<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulador Transparencia y Peticiones | SÍ AL MÉRITO</title><style>:root{--a:#123b63;--b:#159947;--bg:#f4f8f5;--g:#617184}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#19324a;font-family:Arial,sans-serif;line-height:1.5}header{background:linear-gradient(135deg,var(--a),#1b6b8f);color:#fff;padding:28px 6%}header p{margin:0;color:#eaf5f6}main{max-width:820px;margin:24px auto;padding:0 6%}.card{background:#fff;border:1px solid #dbe6e0;border-radius:14px;padding:22px;box-shadow:0 4px 14px #173d5310}.meta{display:flex;justify-content:space-between;color:var(--g);font-size:14px}.bar{height:8px;background:#e5eee9;border-radius:8px;margin:12px 0 22px}.fill{height:100%;width:10%;background:var(--b);border-radius:8px}.option{display:block;border:1px solid #dbe6e0;border-radius:9px;padding:13px;margin:10px 0;cursor:pointer}.option:hover{border-color:var(--b)}button{border:0;border-radius:8px;padding:11px 16px;background:var(--a);color:#fff;font-weight:bold;cursor:pointer}.actions{display:flex;justify-content:space-between;margin-top:20px}.feedback{margin-top:18px;padding:13px;background:#eef8f0;border-left:4px solid var(--b);border-radius:6px}.hidden{display:none}.back{color:#fff;text-decoration:none;border:1px solid #ffffff99;padding:7px 10px;border-radius:6px}.score{text-align:center;font-size:42px;color:var(--a);font-weight:bold}</style></head><body><header><a class="back" href="simuladores.html">← Simuladores</a><h1>Transparencia, Derecho de Petición y PQRSDF</h1><p>Bloque formativo · 10 preguntas · respuesta y retroalimentación</p></header><main><section class="card" id="quiz"><div class="meta"><span id="topic"></span><span id="count"></span></div><div class="bar"><div class="fill" id="fill"></div></div><h2 id="question"></h2><div id="options"></div><div id="feedback" class="feedback hidden"></div><div class="actions"><button id="prev">Anterior</button><button id="next">Responder</button></div></section><section class="card hidden" id="result"><h2>Resultado del bloque</h2><div class="score" id="score"></div><p>Transparencia: preguntas 1 a 4 · Derecho de petición: preguntas 5 a 8 · PQRSDF: preguntas 9 y 10.</p><button onclick="location.reload()">Intentar nuevamente</button></section></main><script>const Q=[
{t:'Transparencia',q:'Una entidad debe publicar información institucional para facilitar el control ciudadano. ¿Qué modalidad describe mejor esta obligación?',o:['Transparencia activa','Reserva automática','Información verbal privada','Publicidad solo por solicitud'],a:0,f:'La transparencia activa implica divulgar proactivamente la información pública que debe estar disponible.'},
{t:'Transparencia',q:'Una persona solicita información pública que no está sometida a reserva legal. ¿Cuál debe ser la actuación inicial de la entidad?',o:['Negarla por regla general','Orientar y tramitar la solicitud conforme al derecho de acceso','Exigir que explique para qué la necesita','Remitirla siempre a un particular'],a:1,f:'El acceso a la información pública es la regla; las limitaciones deben tener fundamento legal.'},
{t:'Transparencia',q:'Un funcionario considera que un documento es reservado porque contiene datos sensibles. ¿Qué debe hacer?',o:['Publicarlo completo sin análisis','Aplicar la reserva únicamente con fundamento legal y proteger la información correspondiente','Destruir el documento','Negar toda información relacionada'],a:1,f:'La reserva no se presume: debe estar sustentada en la Constitución o la ley y aplicarse de manera proporcional.'},
{t:'Transparencia',q:'Para fortalecer la rendición de cuentas, una entidad presenta datos verificables sobre su gestión y permite preguntas ciudadanas. ¿Qué principio está aplicando?',o:['Transparencia y control social','Secreto institucional','Preferencia administrativa','Discrecionalidad absoluta'],a:0,f:'La información clara y verificable permite el control ciudadano y la rendición de cuentas.'},
{t:'Derecho de petición',q:'Una petición fue recibida por una autoridad. ¿Cómo debe ser la respuesta?',o:['Tardía y genérica','Oportuna, clara, de fondo y congruente','Solo verbal y sin registro','Condicionada a una recomendación'],a:1,f:'La respuesta debe atender realmente lo solicitado y respetar el término aplicable.'},
{t:'Derecho de petición',q:'La dependencia que recibe una petición no es competente para resolverla. ¿Cuál actuación protege mejor al peticionario?',o:['Ignorarla','Remitirla a la autoridad competente e informar al interesado, conforme al trámite aplicable','Archivarla de inmediato','Exigir que la persona la presente de nuevo sin orientación'],a:1,f:'La falta de competencia no autoriza a ignorar la petición; debe aplicarse el trámite legal correspondiente.'},
{t:'Derecho de petición',q:'Una respuesta cita normas, pero no resuelve las preguntas concretas de la persona. ¿Qué aspecto está incumpliendo principalmente?',o:['La congruencia y respuesta de fondo','La reserva automática','La autonomía territorial','La organización electoral'],a:0,f:'Una respuesta debe ser de fondo y congruente con lo pedido, no limitarse a transcribir normas.'},
{t:'Derecho de petición',q:'Antes de cerrar una petición, el servidor revisa el término, la competencia, los anexos y la claridad de la respuesta. ¿Qué conducta demuestra?',o:['Gestión diligente y garantía del derecho','Obstrucción del trámite','Preferencia indebida','Desconocimiento del procedimiento'],a:0,f:'Verificar esos elementos favorece una respuesta oportuna, completa y jurídicamente sustentada.'},
{t:'PQRSDF',q:'Una persona presenta una queja y solicita seguimiento. ¿Qué debería garantizar la entidad?',o:['Radicación, trámite, seguimiento y respuesta','Solo recibirla verbalmente','Eliminarla si es crítica','Responder únicamente si se vuelve viral'],a:0,f:'La atención de PQRSDF exige trazabilidad desde la recepción hasta la respuesta.'},
{t:'PQRSDF',q:'Un ciudadano llega inconforme y utiliza un tono fuerte. ¿Cuál es la mejor respuesta del servidor?',o:['Discutir y terminar la atención','Escuchar, mantener respeto, identificar la solicitud y orientar el canal y trámite procedentes','Prometer una solución fuera de sus competencias','Pedirle que regrese cuando esté tranquilo'],a:1,f:'La atención debe ser respetuosa, clara y orientada a una solución dentro de las competencias institucionales.'}
];let i=0,score=0,answered=false;const $=id=>document.getElementById(id);function render(){let x=Q[i];$('topic').textContent=x.t;$('count').textContent=`Pregunta ${i+1} de ${Q.length}`;$('fill').style.width=((i+1)/Q.length*100)+'%';$('question').textContent=x.q;$('options').innerHTML=x.o.map((v,n)=>`<label class="option"><input type="radio" name="answer" value="${n}"> ${v}</label>`).join('');$('feedback').classList.add('hidden');$('feedback').textContent='';$('prev').disabled=i===0;$('next').textContent='Responder';answered=false}function answer(){let chosen=document.querySelector('input[name=answer]:checked');if(!chosen)return alert('Seleccione una respuesta.');let x=Q[i],ok=+chosen.value===x.a;if(ok)score++;document.querySelectorAll('input[name=answer]').forEach(e=>e.disabled=true);$('feedback').textContent=(ok?'Correcto. ':'Revisemos. ')+x.f;$('feedback').classList.remove('hidden');$('next').textContent=i===Q.length-1?'Ver resultado':'Siguiente';answered=true}$('next').onclick=()=>{if(!answered){answer();return}if(i<Q.length-1){i++;render()}else{$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`${score}/${Q.length}`}};$('prev').onclick=()=>{if(i){i--;render()}};render();</script></body></html>
