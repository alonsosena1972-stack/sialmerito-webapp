<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulador Constitución y Estado | SÍ AL MÉRITO</title><style>:root{--a:#123b63;--b:#159947;--bg:#f4f8f5;--g:#617184}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#19324a;font-family:Arial,sans-serif;line-height:1.5}header{background:linear-gradient(135deg,var(--a),#1b6b8f);color:#fff;padding:28px 6%}header p{margin:0;color:#eaf5f6}main{max-width:820px;margin:24px auto;padding:0 6%}.card{background:#fff;border:1px solid #dbe6e0;border-radius:14px;padding:22px;box-shadow:0 4px 14px #173d5310}.meta{display:flex;justify-content:space-between;color:var(--g);font-size:14px}.bar{height:8px;background:#e5eee9;border-radius:8px;margin:12px 0 22px}.fill{height:100%;width:10%;background:var(--b);border-radius:8px}.option{display:block;border:1px solid #dbe6e0;border-radius:9px;padding:13px;margin:10px 0;cursor:pointer}.option:hover{border-color:var(--b)}button{border:0;border-radius:8px;padding:11px 16px;background:var(--a);color:#fff;font-weight:bold;cursor:pointer}.actions{display:flex;justify-content:space-between;margin-top:20px}.feedback{margin-top:18px;padding:13px;background:#eef8f0;border-left:4px solid var(--b);border-radius:6px}.hidden{display:none}.back{color:#fff;text-decoration:none;border:1px solid #ffffff99;padding:7px 10px;border-radius:6px}.score{text-align:center;font-size:42px;color:var(--a);font-weight:bold}</style></head><body><header><a class="back" href="simuladores.html">← Simuladores</a><h1>Constitución y Estructura del Estado</h1><p>Bloque formativo · 10 preguntas · respuesta y retroalimentación</p></header><main><section class="card" id="quiz"><div class="meta"><span id="topic"></span><span id="count"></span></div><div class="bar"><div class="fill" id="fill"></div></div><h2 id="question"></h2><div id="options"></div><div id="feedback" class="feedback hidden"></div><div class="actions"><button id="prev">Anterior</button><button id="next">Responder</button></div></section><section class="card hidden" id="result"><h2>Resultado del bloque</h2><div class="score" id="score"></div><p id="summary"></p><button onclick="location.reload()">Intentar nuevamente</button></section></main><script>const Q=[
{t:'Constitución',q:'Una entidad debe proveer una vacante de carrera. ¿Cuál criterio debe orientar, como regla general, el ingreso y el ascenso?',o:['La antigüedad sin otra consideración','El mérito','La recomendación del superior','El orden de llegada'],a:1,f:'El artículo 125 de la Constitución establece el mérito como regla general para los empleos de carrera.'},
{t:'Constitución',q:'Al interpretar una actuación administrativa, una persona pregunta cuál debe ser la finalidad principal de la función administrativa.',o:['Favorecer a la entidad sobre el ciudadano','Servir al interés general','Aumentar trámites y controles','Priorizar intereses particulares'],a:1,f:'La función administrativa está al servicio de los intereses generales.'},
{t:'Constitución',q:'En una capacitación se pregunta quién es el titular de la soberanía en Colombia.',o:['El Gobierno nacional','El Congreso','El pueblo','Las entidades territoriales'],a:2,f:'La soberanía reside exclusivamente en el pueblo, según la Constitución.'},
{t:'Constitución',q:'Una autoridad recibe una solicitud relacionada con derechos fundamentales. ¿Cuál deber constitucional orienta su actuación?',o:['Proteger a todas las personas residentes en Colombia','Remitir siempre la solicitud a otra entidad','Resolver solo si existe beneficio institucional','Exigir requisitos no previstos'],a:0,f:'Las autoridades están instituidas para proteger a todas las personas en su vida, honra, bienes, creencias y demás derechos y libertades.'},
{t:'Constitución',q:'¿Cuál conjunto reúne principios de la función administrativa?',o:['Igualdad, moralidad, eficacia, economía, celeridad, imparcialidad y publicidad','Secreto, preferencia y discrecionalidad absoluta','Antigüedad, reserva y informalidad','Beneficio privado, rapidez y silencio'],a:0,f:'El artículo 209 relaciona esos principios y otros previstos constitucionalmente.'},
{t:'Estructura del Estado',q:'Una pregunta de organización estatal solicita identificar las ramas del poder público.',o:['Legislativa, Ejecutiva y Judicial','Electoral, fiscal y municipal','Central, departamental y local','Civil, militar y privada'],a:0,f:'La Constitución distingue las ramas Legislativa, Ejecutiva y Judicial, sin perjuicio de otros órganos autónomos e independientes.'},
{t:'Estructura del Estado',q:'El Congreso expide leyes y ejerce funciones de reforma constitucional en los términos previstos. ¿A qué rama pertenece?',o:['Ejecutiva','Judicial','Legislativa','Electoral'],a:2,f:'El Congreso integra la Rama Legislativa.'},
{t:'Estructura del Estado',q:'Una entidad coordina con otra para cumplir una finalidad estatal común. ¿Qué principio debe orientar esa actuación?',o:['Coordinación','Aislamiento institucional','Preferencia personal','Secreto automático'],a:0,f:'Las autoridades deben coordinar sus actuaciones para el adecuado cumplimiento de los fines del Estado.'},
{t:'Estructura del Estado',q:'¿Cuál órgano ejerce control fiscal sobre la gestión de los recursos públicos dentro de sus competencias?',o:['La Contraloría General de la República','La Registraduría','El Congreso como entidad ejecutora','Una empresa privada'],a:0,f:'La Contraloría integra los órganos de control y ejerce vigilancia de la gestión fiscal.'},
{t:'Estructura del Estado',q:'La descentralización administrativa busca principalmente:',o:['Concentrar todas las decisiones en la Nación','Distribuir competencias y responsabilidades conforme al ordenamiento','Eliminar controles públicos','Sustituir la Constitución por manuales internos'],a:1,f:'La descentralización distribuye competencias y responsabilidades, conservando los controles y reglas aplicables.'}
];let i=0,score=0,answered=false;const $=id=>document.getElementById(id);function render(){let x=Q[i];$('topic').textContent=x.t;$('count').textContent=`Pregunta ${i+1} de ${Q.length}`;$('fill').style.width=((i+1)/Q.length*100)+'%';$('question').textContent=x.q;$('options').innerHTML=x.o.map((v,n)=>`<label class="option"><input type="radio" name="answer" value="${n}"> ${v}</label>`).join('');$('feedback').classList.add('hidden');$('feedback').textContent='';$('prev').disabled=i===0;$('next').textContent='Responder';answered=false}function answer(){let chosen=document.querySelector('input[name=answer]:checked');if(!chosen)return alert('Seleccione una respuesta.');let x=Q[i],ok=+chosen.value===x.a;if(ok)score++;document.querySelectorAll('input[name=answer]').forEach(e=>e.disabled=true);$('feedback').textContent=(ok?'Correcto. ':'Revisemos. ')+x.f;$('feedback').classList.remove('hidden');$('next').textContent=i===Q.length-1?'Ver resultado':'Siguiente';answered=true}$('next').onclick=()=>{if(!answered){answer();return}if(i<Q.length-1){i++;render()}else{$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`${score}/${Q.length}`;$('summary').textContent=`Constitución: preguntas 1 a 5 · Estructura del Estado: preguntas 6 a 10. Resultado formativo, no oficial.`}};$('prev').onclick=()=>{if(i){i--;render()}};render();</script></body></html>
