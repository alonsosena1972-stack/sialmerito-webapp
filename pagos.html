<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagos · SÍ AL MÉRITO</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;margin:0;background:#f5f7fa;color:#192638}header{background:#09233f;color:#fff;padding:28px 6vw}main{max-width:900px;margin:25px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.card{background:#fff;padding:20px;border-radius:14px;border:1px solid #e1e7ee}.price{font-size:25px;font-weight:800;color:#0f6178}button{border:0;border-radius:9px;padding:12px 17px;background:#09233f;color:white;font-weight:700;cursor:pointer}.hidden{display:none}.error{color:#a33}.small{color:#607083;font-size:13px}.wompi-box{margin-top:16px;min-height:44px}label{display:block;font-weight:700;margin-top:12px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccd6df;border-radius:8px;margin-top:5px}</style></head><body><header><strong>SÍ AL MÉRITO</strong><h1>Servicios de preparación</h1><p>Seleccione el servicio que desea adquirir.</p></header><main><section class="grid" id="services"></section><section class="card hidden" id="checkout"><h2 id="chosen"></h2><label for="full-name">Nombres y apellidos</label><input id="full-name" type="text" placeholder="Nombres y apellidos completos" autocomplete="name"><label for="phone">Celular</label><input id="phone" type="tel" placeholder="Ej. 3001234567" autocomplete="tel"><label for="email">Correo electrónico</label><input id="email" type="email" placeholder="correo@ejemplo.com" autocomplete="email"><p id="msg" class="error"></p><button id="pay">Continuar al pago</button><div id="wompi-box" class="wompi-box"></div><p class="small">La plataforma no almacena datos de tarjetas.</p></section></main><script>
const PUBLIC_KEY='pub_prod_PtWbYYwFGt2d1cj696HJKk1oSWGtJ69Q';const SUPABASE_URL='https://ygbawnqvrynvxmdgqqvw.supabase.co';const SUPABASE_KEY='sb_publishable_wtYql947qdzvdkfi2_IUNA_gQ64GNAK';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const SERVICES=[['Asesoría personalizada integral',120000],['Simulacro VIP en Wordwall',30000],['Escogencia de OPEC',50000],['Organización de hoja de vida en SIMO',50000],['Diagnóstico y optimización de hoja de vida',20000],['Derecho de petición y reclamaciones',50000],['Simulacro especializado de 80 preguntas',50000],['Comprensión lectora · 50 ejercicios',30000],['Lectura crítica · 50 ejercicios',30000]];const SERVICE_CODES=['ASESORIA','VIP','OPEC','SIMO','DIAGNOSTICO','DERECHO','ESP80','COMPRENSION','CRITICA'];let selected=null;const $=x=>document.getElementById(x);const money=n=>n.toLocaleString('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0});
$('services').innerHTML=SERVICES.map((s,i)=>`<article class="card"><h3>${s[0]}</h3><p class="price">${money(s[1])}</p><button onclick="choose(${i})">Seleccionar</button></article>`).join('');window.choose=i=>{selected=SERVICES[i];$('chosen').textContent=selected[0]+' · '+money(selected[1]);$('checkout').classList.remove('hidden');$('checkout').scrollIntoView({behavior:'smooth'});};
async function registerOrder(reference,fullName,phone,email){try{const orderResult=await sb.from('ordenes').insert({nombre_completo:fullName,celular:phone,email,total:selected[1],estado_pago:'Pago pendiente',estado_atencion:'Nueva',referencia_pago:reference}).select('id').single();if(orderResult.error||!orderResult.data?.id){console.warn('No se pudo registrar la orden',orderResult.error);return null;}const itemResult=await sb.from('orden_items').insert({orden_id:orderResult.data.id,nombre_producto:selected[0],precio:selected[1],cantidad:1});if(itemResult.error)console.warn('Orden creada sin detalle',itemResult.error);return orderResult.data.id;}catch(error){console.warn('Registro de orden no disponible',error);return null;}}
$('pay').onclick=async()=>{const fullName=$('full-name').value.trim();const phone=$('phone').value.trim();const email=$('email').value.trim().toLowerCase();if(!selected||fullName.length<5||phone.replace(/\D/g,'').length<7||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){$('msg').textContent='Completa nombres y apellidos, celular y correo válido.';return;}const serviceCode=SERVICE_CODES[SERVICES.indexOf(selected)]||'SERVICIO';const reference='SAM-'+serviceCode+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7).toUpperCase();const amount=selected[1]*100;const pay=$('pay');pay.disabled=true;$('msg').textContent='Preparando el pago seguro…';$('wompi-box').innerHTML='';try{const orderId=await registerOrder(reference,fullName,phone,email);const r=await fetch('/api/wompi-signature',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference,amountInCents:amount,currency:'COP'})});const data=await r.json();if(!r.ok)throw new Error(data.error||'No fue posible preparar el pago.');const script=document.createElement('script');script.src='https://checkout.wompi.co/widget.js';script.setAttribute('data-render','button');script.setAttribute('data-public-key',PUBLIC_KEY);script.setAttribute('data-currency','COP');script.setAttribute('data-amount-in-cents',String(amount));script.setAttribute('data-reference',reference);script.setAttribute('data-signature:integrity',data.signature);script.setAttribute('data-customer-data:full-name',fullName);script.setAttribute('data-customer-data:phone-number',phone);script.setAttribute('data-customer-data:phone-number-prefix','+57');script.setAttribute('data-customer-data:email',email);script.setAttribute('data-redirect-url',location.origin+'/pagos.html'+(orderId?'?order='+orderId:''));script.onload=()=>{$('msg').textContent='';pay.style.display='none';};script.onerror=()=>{throw new Error('No se pudo cargar el botón seguro de Wompi.');};$('wompi-box').appendChild(script);setTimeout(()=>{if(!$('wompi-box').querySelector('iframe')&&!$('wompi-box').querySelector('button')){pay.disabled=false;$('msg').textContent='Wompi tardó en cargar. Intenta nuevamente o revisa la conexión.';}},12000);}catch(error){pay.disabled=false;$('msg').textContent=error.message;}};
</script></body></html>
