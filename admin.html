<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel privado · SÍ AL MÉRITO</title><script src="supabase.min.js"></script><style>body{font-family:Arial;margin:0;background:#f4f8f5;color:#19324a}header{background:#123b63;color:white;padding:20px 6%;display:flex;justify-content:space-between}main{max-width:1200px;margin:25px auto;padding:0 18px}.box{background:white;border-radius:14px;padding:20px;box-shadow:0 4px 18px #123b6318;margin-bottom:20px}input,select,button{padding:10px;border-radius:7px;border:1px solid #c8d5df;font-size:1rem;margin:4px}button{background:#159947;color:white;border:0;font-weight:bold;cursor:pointer}.danger{background:#b42318}.hidden{display:none}.msg{padding:12px;border-radius:8px;background:#edf8f1;margin-top:10px}.error{background:#fff0f0;color:#a22}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:10px;border-bottom:1px solid #e5edf0;text-align:left;vertical-align:top}th{background:#eef8f3;color:#123b63}small{color:#526b7d}</style></head><body><header><strong>SÍ AL MÉRITO · Panel privado</strong><button id="salir" class="danger hidden">Cerrar sesión</button></header><main><section id="login" class="box"><h2>Acceso administrativo</h2><p>Ingrese el correo autorizado y su contraseña.</p><input id="email" type="email" value="alonsosena1972@gmail.com" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button id="entrar">Ingresar</button><div id="loginMsg"></div></section><section id="panel" class="hidden"><div class="box"><h2>Pedidos registrados</h2><small>Consulta privada. Los estados son internos y no modifican los datos del cliente.</small><br><button id="recargar">Actualizar</button><select id="filtro"><option value="">Todos los estados de atención</option><option>Nueva</option><option>Contactada</option><option>En proceso</option><option>Entregada</option><option>Cerrada</option></select><div id="ordenes" class="scroll">Cargando...</div></div></section></main><script>const URL='https://ygbawnqvrynvxmdgqqvw.supabase.co',KEY='sb_publishable_wtYql947qdzvdkfi2_IUNA_gQ64GNAK',sb=supabase.createClient(URL,KEY),$=id=>document.getElementById(id),money=n=>'$'+Number(n||0).toLocaleString('es-CO')+' COP';let rows=[];function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}async function login(){const r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error){$('loginMsg').className='msg error';$('loginMsg').textContent='No fue posible ingresar. Verifique sus datos.';return}show()}async function show(){$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('salir').classList.remove('hidden');await load()}async function load(){const r=await sb.from('tablero_pedidos_claro').select('*').order('creado_en',{ascending:false});if(r.error){$('ordenes').innerHTML='<p class="msg error">No fue posible consultar los pedidos con esta sesión.</p>';return}rows=r.data||[];render()}function render(){const f=$('filtro').value,x=rows.filter(r=>!f||r.estado_atencion===f);if(!x.length){$('ordenes').innerHTML='<p>No hay pedidos.</p>';return}$('ordenes').innerHTML='<table><thead><tr><th>Fecha</th><th>Cliente y contacto</th><th>Servicio solicitado</th><th>Total</th><th>Pago</th><th>Atención</th><th>Acción</th></tr></thead><tbody>'+x.map(r=>'<tr><td>'+esc(String(r.creado_en||'').replace('T',' ').replace('Z',''))+'</td><td><b>'+esc(r.nombre_completo)+'</b><br>'+esc(r.celular)+'<br>'+esc(r.email)+'</td><td>'+esc(r.servicio_solicitado||'Sin servicio registrado')+'</td><td>'+money(r.total)+'</td><td><select data-pago="'+r.id+'"><option '+(r.estado_pago==='Pendiente'?'selected':'')+'>Pendiente</option><option '+(r.estado_pago==='Pago reportado'?'selected':'')+'>Pago reportado</option><option '+(r.estado_pago==='Pagado'?'selected':'')+'>Pagado</option><option '+(r.estado_pago==='Rechazado'?'selected':'')+'>Rechazado</option></select></td><td><select data-atencion="'+r.id+'"><option '+(r.estado_atencion==='Nueva'?'selected':'')+'>Nueva</option><option '+(r.estado_atencion==='Contactada'?'selected':'')+'>Contactada</option><option '+(r.estado_atencion==='En proceso'?'selected':'')+'>En proceso</option><option '+(r.estado_atencion==='Entregada'?'selected':'')+'>Entregada</option><option '+(r.estado_atencion==='Cerrada'?'selected':'')+'>Cerrada</option></select></td><td><button data-guardar="'+r.id+'">Guardar</button></td></tr>').join('')+'</tbody></table>';document.querySelectorAll('[data-guardar]').forEach(b=>b.onclick=()=>guardar(b.dataset.guardar))}async function guardar(id){const a=document.querySelector('[data-atencion="'+id+'"]').value,p=document.querySelector('[data-pago="'+id+'"]').value,r=await sb.rpc('actualizar_estado_pedido',{p_id:id,p_estado_atencion:a,p_estado_pago:p});if(r.error)alert('No fue posible guardar los estados.');else{alert('Estados guardados correctamente.');load()}}$('entrar').onclick=login;$('recargar').onclick=load;$('filtro').onchange=render;$('salir').onclick=async()=>{await sb.auth.signOut();location.reload()};sb.auth.getSession().then(({data})=>{if(data.session)show()});</script></body></html>
