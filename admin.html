<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel privado · SÍ AL MÉRITO</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;margin:0;background:#f4f8f5;color:#19324a}header{background:#123b63;color:#fff;padding:20px 6%;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:30px auto;padding:0 18px}.box{background:#fff;border-radius:14px;padding:22px;box-shadow:0 4px 18px #123b6318;margin-bottom:20px}input,select,button{padding:11px;border-radius:7px;border:1px solid #c8d5df;font-size:1rem;margin:5px}button{background:#159947;color:#fff;border:0;font-weight:bold;cursor:pointer}.danger{background:#b42318}.hidden{display:none}.msg{padding:12px;border-radius:8px;background:#edf8f1;margin-top:12px}.error{background:#fff0f0;color:#a22}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:10px;border-bottom:1px solid #e5edf0;text-align:left;vertical-align:top}th{background:#eef8f3;color:#123b63}.scroll{overflow:auto}</style></head><body><header><strong>SÍ AL MÉRITO · Panel privado</strong><button id="salir" class="danger hidden">Cerrar sesión</button></header><main><section id="login" class="box"><h2>Acceso administrativo</h2><p>Ingrese el correo autorizado y su contraseña.</p><input id="email" type="email" value="alonsosena1972@gmail.com" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button id="entrar">Ingresar</button><div id="loginMsg"></div></section><section id="panel" class="hidden"><div class="box"><h2>Resultados de simuladores</h2><p class="small">Consulta privada para administración. Los resultados no son públicos.</p><button id="recargarSim">Actualizar resultados</button><input id="fSimulador" placeholder="Filtrar por simulador"><input id="fCorreo" type="email" placeholder="Filtrar por correo"><input id="fDesde" type="date"><input id="fHasta" type="date"><div id="simResumen" class="msg">Resumen: cargando...</div><div id="simResultados" class="scroll"><p>Cargando resultados...</p></div></div><div class="box"><h2>Órdenes del carrito</h2><button id="recargar">Actualizar</button><select id="filtro"><option value="">Todos los estados</option><option>Nueva</option><option>Pago pendiente</option><option>Pagada</option><option>En proceso</option><option>Entregada</option><option>Cerrada</option></select><div id="ordenes" class="scroll"></div></div><div class="box"><h2>Solicitudes de orientación</h2><div id="solicitudes" class="scroll"></div></div></section></main><script>const URL='https://ygbawnqvrynvxmdgqqvw.supabase.co',KEY='sb_publishable_wtYql947qdzvdkfi2_IUNA_gQ64GNAK',sb=supabase.createClient(URL,KEY);let rows=[],simRows=[];const $=id=>document.getElementById(id),money=n=>'$'+Number(n||0).toLocaleString('es-CO')+' COP';$('entrar').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error){$('loginMsg').className='msg error';$('loginMsg').textContent='No fue posible ingresar. Verifique sus datos.';return}showPanel()};async function showPanel(){$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('salir').classList.remove('hidden');await load()}$('salir').onclick=async()=>{await sb.auth.signOut();location.reload()};function renderSims(){let scores=sim.map(r=>Number(r.puntaje_total)||0),avg=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1):'0.0',best=scores.length?Math.max(...scores):0;$('simResumen').textContent=`Intentos: ${sim.length} · Promedio: ${avg}/100 · Mejor puntaje: ${best}/100`;const cols=['created_at','email','simulador','puntaje_total','puntaje_comportamental','puntaje_integridad','puntaje_integrador'];$('simResultados').innerHTML=table(sim,cols)||'<p>No hay resultados que coincidan con los filtros.</p>'}async function load(){const sim=await sb.from('simulador_intentos').select('*');if(sim.error){$('simResultados').innerHTML='<p class="msg error">No fue posible consultar los resultados con esta sesión administrativa.</p>'}else{simRows=sim.data||[];renderSims()}const o=await sb.from('ordenes').select('id,creado_en,nombre_completo,celular,email,total,estado_pago,estado_atencion,referencia_pago,orden_items(nombre_producto,precio,cantidad)').order('creado_en',{ascending:false});rows=o.data||[];render();const s=await sb.from('solicitudes_servicio').select('*').order('creado_en',{ascending:false});$('solicitudes').innerHTML=s.error?'<p>No hay solicitudes para mostrar.</p>':table(s.data,['creado_en','nombre_completo','celular','email','servicio','detalle','estado'])}function render(){let x=rows.filter(r=>!$('filtro').value||r.estado_atencion===$('filtro').value);$('ordenes').innerHTML=table(x,['creado_en','nombre_completo','celular','email','total','estado_pago','estado_atencion','orden_items'])||'<p>No hay órdenes.</p>'}function table(data,cols){if(!data.length)return '';return '<table><thead><tr>'+cols.map(c=>'<th>'+c.replaceAll('_',' ')+'</th>').join('')+'</tr></thead><tbody>'+data.map(r=>'<tr>'+cols.map(c=>'<td>'+ (c==='total'?money(r[c]):c==='orden_items'?(r[c]||[]).map(i=>i.nombre_producto+' × '+i.cantidad+' ('+money(i.precio)+')').join('<br>'):String(r[c]??'').replaceAll('<','&lt;'))+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}$('recargar').onclick=load;$('recargarSim').onclick=load;['fSimulador','fCorreo','fDesde','fHasta'].forEach(id=>$(id).oninput=renderSims);$('filtro').onchange=render;sb.auth.getSession().then(({data})=>{if(data.session)showPanel()});</script></body></html>
