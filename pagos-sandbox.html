<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba Sandbox · SÍ AL MÉRITO</title><script src="https://checkout.wompi.co/widget.js"></script><style>body{font-family:system-ui;margin:0;background:#f5f7fa;color:#192638}header{background:#09233f;color:#fff;padding:28px 6vw}main{max-width:600px;margin:30px auto;padding:0 18px}.card{background:#fff;padding:24px;border-radius:14px;border:1px solid #e1e7ee}.price{font-size:28px;font-weight:800;color:#0f6178}label{display:block;font-weight:700;margin-top:18px}input{width:100%;box-sizing:border-box;padding:13px;margin-top:7px;border:1px solid #ccd6df;border-radius:8px;font-size:16px}button{border:0;border-radius:9px;padding:13px 18px;background:#09233f;color:#fff;font-weight:700;cursor:pointer;margin-top:20px}.error{color:#a33}.ok{color:#176b45}.small{color:#607083;font-size:13px}</style></head><body><header><strong>SÍ AL MÉRITO</strong><h1>Prueba técnica de pago</h1><p>Sandbox · No se realiza ningún cobro real</p></header><main><section class="card"><h2>Servicio de prueba</h2><p class="price">$20.000 COP</p><p>Esta operación solo comprobará la comunicación entre Wompi Sandbox y el receptor de eventos.</p><label for="email">Correo electrónico</label><input id="email" type="email" placeholder="correo@ejemplo.com" autocomplete="email"><p id="msg" class="error"></p><button id="pay">Continuar con prueba Sandbox</button><p class="small">Usa únicamente medios y credenciales de prueba de Wompi.</p></section></main><script>const PUBLIC_KEY='pub_test_NZ7NS7bYatmsl4V1B08KPvXIwoNBIPTS';const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const tx=params.get('id');if(tx){$('msg').className='ok';$('msg').textContent='Wompi devolvió la transacción '+tx+'. La confirmación definitiva se valida por webhook.';$('pay').disabled=true;}$('pay').onclick=async()=>{const email=$('email').value.trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){$('msg').textContent='Escribe un correo válido.';return;}const reference='SAM-TEST-'+Date.now();const amount=2000000;$('pay').disabled=true;$('msg').textContent='Preparando la prueba…';try{const r=await fetch('/api/wompi-signature-sandbox',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference,amountInCents:amount,currency:'COP'})});const data=await r.json();if(!r.ok)throw new Error(data.error||'No fue posible preparar la prueba.');if(!window.WidgetCheckout){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://checkout.wompi.co/widget.js';s.onload=resolve;s.onerror=()=>reject(new Error('No se pudo cargar el checkout de Wompi.'));document.head.appendChild(s);});}const checkout=new WidgetCheckout({currency:'COP',amountInCents:amount,reference,publicKey:PUBLIC_KEY,signature:{integrity:data.signature},redirectUrl:location.origin+location.pathname,customerData:{email}});$('msg').textContent='Abriendo Wompi Sandbox…';checkout.open(function(result){if(result&&result.transaction){$('msg').className='ok';$('msg').textContent='Wompi devolvió la transacción '+result.transaction.id+'. La confirmación definitiva se valida por webhook.';}});}catch(e){$('msg').className='error';$('msg').textContent=e.message;$('pay').disabled=false;}};</script></body></html>
