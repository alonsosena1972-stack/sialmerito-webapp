<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba Sandbox · SÍ AL MÉRITO</title><style>body{font-family:system-ui;margin:0;background:#f5f7fa;color:#192638}header{background:#09233f;color:#fff;padding:28px 6vw}main{max-width:600px;margin:30px auto;padding:0 18px}.card{background:#fff;padding:24px;border-radius:14px;border:1px solid #e1e7ee}.price{font-size:28px;font-weight:800;color:#0f6178}label{display:block;font-weight:700;margin-top:18px}input{width:100%;box-sizing:border-box;padding:13px;margin-top:7px;border:1px solid #ccd6df;border-radius:8px;font-size:16px}button{border:0;border-radius:9px;padding:13px 18px;background:#09233f;color:#fff;font-weight:700;cursor:pointer;margin-top:20px}.error{color:#a33}.small{color:#607083;font-size:13px}</style></head><body><header><strong>SÍ AL MÉRITO</strong><h1>Prueba técnica de pago</h1><p>Sandbox · No se realiza ningún cobro real</p></header><main><section class="card"><h2>Servicio de prueba</h2><p class="price">$20.000 COP</p><p>Esta operación solo comprobará la comunicación entre Wompi Sandbox y el receptor de eventos.</p><label for="email">Correo electrónico</label><input id="email" type="email" placeholder="correo@ejemplo.com" autocomplete="email"><p id="msg" class="error"></p><button id="pay">Continuar con prueba Sandbox</button><div id="widget"></div><p class="small">Usa únicamente medios y credenciales de prueba de Wompi.</p></section></main><script>const PUBLIC_KEY='pub_test_NZ7NS7bYatmsl4V1B08KPvXIwoNBIPTS';const $=id=>document.getElementById(id);$('pay').onclick=async()=>{const email=$('email').value.trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){$('msg').textContent='Escribe un correo válido.';return;}const reference='SAM-TEST-'+Date.now();const amount=2000000;$('pay').disabled=true;$('msg').textContent='Preparando la prueba…';try{const r=await fetch('/api/wompi-signature-sandbox',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference,amountInCents:amount,currency:'COP'})});const data=await r.json();if(!r.ok)throw new Error(data.error||'No fue posible preparar la prueba.');const s=document.createElement('script');s.src='https://checkout.wompi.co/widget.js';s.dataset.render='button';s.dataset.publicKey=PUBLIC_KEY;s.dataset.currency='COP';s.dataset.amountInCents=amount;s.dataset.reference=reference;s.setAttribute('data-signature:integrity',data.signature);s.setAttribute('data-customer-data:email',email);s.dataset.redirectUrl=location.href;$('widget').appendChild(s);$('msg').textContent='Pulsa el botón de Wompi para continuar.';}catch(e){$('msg').textContent=e.message;$('pay').disabled=false;}};</script></body></html>
