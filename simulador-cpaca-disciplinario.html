<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulador CPACA y Régimen Disciplinario | SÍ AL MÉRITO</title><style>:root{--a:#123b63;--b:#159947;--bg:#f4f8f5;--g:#617184}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#19324a;font-family:Arial,sans-serif;line-height:1.5}header{background:linear-gradient(135deg,var(--a),#1b6b8f);color:#fff;padding:28px 6%}header p{margin:0;color:#eaf5f6}main{max-width:820px;margin:24px auto;padding:0 6%}.card{background:#fff;border:1px solid #dbe6e0;border-radius:14px;padding:22px;box-shadow:0 4px 14px #173d5310}.meta{display:flex;justify-content:space-between;color:var(--g);font-size:14px}.bar{height:8px;background:#e5eee9;border-radius:8px;margin:12px 0 22px}.fill{height:100%;width:10%;background:var(--b);border-radius:8px}.option{display:block;border:1px solid #dbe6e0;border-radius:9px;padding:13px;margin:10px 0;cursor:pointer}.option:hover{border-color:var(--b)}button{border:0;border-radius:8px;padding:11px 16px;background:var(--a);color:#fff;font-weight:bold;cursor:pointer}.actions{display:flex;justify-content:space-between;margin-top:20px}.feedback{margin-top:18px;padding:13px;background:#eef8f0;border-left:4px solid var(--b);border-radius:6px}.hidden{display:none}.back{color:#fff;text-decoration:none;border:1px solid #ffffff99;padding:7px 10px;border-radius:6px}.score{text-align:center;font-size:42px;color:var(--a);font-weight:bold}</style></head><body><header><a class="back" href="simuladores.html">← Simuladores</a><h1>CPACA y Régimen Disciplinario</h1><p>Bloque formativo · 10 preguntas · respuesta y retroalimentación</p></header><main><section class="card" id="quiz"><div class="meta"><span id="topic"></span><span id="count"></span></div><div class="bar"><div class="fill" id="fill"></div></div><h2 id="question"></h2><div id="options"></div><div id="feedback" class="feedback hidden"></div><div class="actions"><button id="prev">Anterior</button><button id="next">Responder</button></div></section><section class="card hidden" id="result"><h2>Resultado del bloque</h2><div class="score" id="score"></div><p>CPACA: preguntas 1 a 5 · Régimen disciplinario: preguntas 6 a 10.</p><button onclick="location.reload()">Intentar nuevamente</button></section></main><script>const Q=[{"t": "CPACA", "q": "Una autoridad inicia una actuación que puede afectar los derechos de una persona. ¿Qué garantía debe respetar durante el trámite?", "o": ["Debido proceso", "Reserva automática", "Preferencia del funcionario", "Decisión sin motivación"], "a": 0, "f": "El debido proceso se aplica a toda actuación administrativa."}, {"t": "CPACA", "q": "Antes de expedir una decisión, la entidad identifica los hechos, las normas aplicables y las pruebas relevantes. ¿Qué busca asegurar?", "o": ["Una decisión motivada y fundada", "Un trámite secreto", "La eliminación de recursos", "La reducción de la participación"], "a": 0, "f": "La decisión administrativa debe apoyarse en hechos y fundamentos jurídicos verificables."}, {"t": "CPACA", "q": "Una persona recibe una decisión administrativa con la que no está de acuerdo. ¿Qué debe revisar para controvertirla?", "o": ["Los recursos procedentes, términos y autoridad competente", "Solo la opinión de otro ciudadano", "Un trámite informal sin plazo", "La autorización de un particular"], "a": 0, "f": "El CPACA regula medios de control y recursos, sujetos a requisitos y términos."}, {"t": "CPACA", "q": "Una entidad tiene información necesaria para decidir, pero está en otra dependencia pública. ¿Cuál actuación favorece la eficacia y coordinación?", "o": ["Gestionarla por los canales institucionales y dejar trazabilidad", "Exigir al ciudadano que la consiga siempre", "Resolver sin verificarla", "Ocultarla para acelerar el trámite"], "a": 0, "f": "La actuación administrativa debe ser coordinada, eficaz y trazable."}, {"t": "CPACA", "q": "Una decisión afecta a una persona, pero el acto no explica las razones ni las normas aplicadas. ¿Qué problema principal presenta?", "o": ["Falta de motivación y posible afectación del debido proceso", "Exceso de publicidad", "Aplicación automática de la descentralización", "Cumplimiento pleno del trámite"], "a": 0, "f": "La motivación permite conocer las razones de la decisión y ejercer contradicción."}, {"t": "Régimen disciplinario", "q": "Un servidor incumple un deber funcional. Antes de atribuir responsabilidad, la autoridad debe:", "o": ["Respetar el debido proceso, verificar la conducta y garantizar la defensa", "Sancionar sin escuchar", "Publicar una acusación", "Aplicar una sanción informal"], "a": 0, "f": "La responsabilidad disciplinaria exige actuación conforme a las garantías legales."}, {"t": "Régimen disciplinario", "q": "Durante una actuación disciplinaria, el investigado solicita conocer y controvertir las pruebas. ¿Qué garantía está ejerciendo?", "o": ["Derecho de defensa y contradicción", "Transparencia activa únicamente", "Descentralización", "Delegación"], "a": 0, "f": "La defensa y la contradicción permiten participar frente a las pruebas y decisiones."}, {"t": "Régimen disciplinario", "q": "Una autoridad recibe información sobre una posible falta, pero aún no tiene elementos suficientes. ¿Cuál es la conducta adecuada?", "o": ["Verificar los hechos mediante el procedimiento aplicable", "Declarar culpable al servidor", "Difundir la información", "Cerrar el caso sin análisis"], "a": 0, "f": "La autoridad debe investigar conforme al procedimiento y no anticipar responsabilidad."}, {"t": "Régimen disciplinario", "q": "Una persona participa en la instrucción de un asunto y luego pretende decidirlo sin revisar las reglas de competencia e imparcialidad. ¿Qué debe hacer?", "o": ["Verificar la separación de funciones, competencia e imparcialidad aplicables", "Decidir de inmediato", "Delegar informalmente", "Ignorar el posible conflicto"], "a": 0, "f": "La imparcialidad y las reglas de competencia son esenciales en el trámite disciplinario."}, {"t": "Régimen disciplinario", "q": "Al finalizar una actuación disciplinaria, la decisión debe guardar relación con los hechos probados y las normas aplicables. Esto exige:", "o": ["Congruencia, motivación y respeto por las garantías procesales", "Decisión basada en rumores", "Sanción automática", "Ausencia de fundamentos"], "a": 0, "f": "La decisión debe ser congruente, motivada y respetuosa del debido proceso."}];let i=0,score=0,answered=false;const $=id=>document.getElementById(id);function render(){let x=Q[i];$('topic').textContent=x.t;$('count').textContent=`Pregunta ${i+1} de ${Q.length}`;$('fill').style.width=((i+1)/Q.length*100)+'%';$('question').textContent=x.q;$('options').innerHTML=x.o.map((v,n)=>`<label class="option"><input type="radio" name="answer" value="${n}"> ${v}</label>`).join('');$('feedback').classList.add('hidden');$('feedback').textContent='';$('prev').disabled=i===0;$('next').textContent='Responder';answered=false}function answer(){let chosen=document.querySelector('input[name=answer]:checked');if(!chosen)return alert('Seleccione una respuesta.');let x=Q[i],ok=+chosen.value===x.a;if(ok)score++;document.querySelectorAll('input[name=answer]').forEach(e=>e.disabled=true);$('feedback').textContent=(ok?'Correcto. ':'Revisemos. ')+x.f;$('feedback').classList.remove('hidden');$('next').textContent=i===Q.length-1?'Ver resultado':'Siguiente';answered=true}$('next').onclick=()=>{if(!answered){answer();return}if(i<Q.length-1){i++;render()}else{$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`${score}/${Q.length}`}};$('prev').onclick=()=>{if(i){i--;render()}};render();</script></body></html>
