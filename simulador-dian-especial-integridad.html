<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulador DIAN Especial e Integridad | SÍ AL MÉRITO</title><style>:root{--a:#123b63;--b:#159947;--bg:#f4f8f5;--g:#617184}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#19324a;font-family:Arial,sans-serif;line-height:1.5}header{background:linear-gradient(135deg,var(--a),#1b6b8f);color:#fff;padding:28px 6%}header p{margin:0;color:#eaf5f6}main{max-width:820px;margin:24px auto;padding:0 6%}.card{background:#fff;border:1px solid #dbe6e0;border-radius:14px;padding:22px;box-shadow:0 4px 14px #173d5310}.meta{display:flex;justify-content:space-between;color:var(--g);font-size:14px}.bar{height:8px;background:#e5eee9;border-radius:8px;margin:12px 0 22px}.fill{height:100%;width:10%;background:var(--b);border-radius:8px}.option{display:block;border:1px solid #dbe6e0;border-radius:9px;padding:13px;margin:10px 0;cursor:pointer}.option:hover{border-color:var(--b)}button{border:0;border-radius:8px;padding:11px 16px;background:var(--a);color:#fff;font-weight:bold;cursor:pointer}.actions{display:flex;justify-content:space-between;margin-top:20px}.feedback{margin-top:18px;padding:13px;background:#eef8f0;border-left:4px solid var(--b);border-radius:6px}.hidden{display:none}.back{color:#fff;text-decoration:none;border:1px solid #ffffff99;padding:7px 10px;border-radius:6px}.score{text-align:center;font-size:42px;color:var(--a);font-weight:bold}</style></head><body><header><a class="back" href="simuladores.html">← Simuladores</a><h1>Competencias Especiales DIAN y Código de Integridad DIAN</h1><p>Bloque formativo · 10 preguntas · respuesta y retroalimentación</p></header><main><section class="card" id="quiz"><div class="meta"><span id="topic"></span><span id="count"></span></div><div class="bar"><div class="fill" id="fill"></div></div><h2 id="question"></h2><div id="options"></div><div id="feedback" class="feedback hidden"></div><div class="actions"><button id="prev">Anterior</button><button id="next">Responder</button></div></section><section class="card hidden" id="result"><h2>Resultado del bloque</h2><div class="score" id="score"></div><p>Competencias DIAN: preguntas 1 a 5 · Integridad DIAN: preguntas 6 a 10.</p><button onclick="location.reload()">Intentar nuevamente</button></section></main><script>const Q=[{"t": "Resolución 0065", "q": "Una pregunta evalúa competencias comportamentales específicas de un empleo DIAN. ¿Cuál fuente debe consultarse como referencia principal?", "o": ["El Diccionario de Competencias Comportamentales DIAN adoptado por la Resolución 0065 de 2024", "Solo el Decreto 815 de 2018", "Una opinión sin fuente oficial", "Un manual de otra entidad"], "a": 0, "f": "La Resolución 0065 de 2024 y su diccionario constituyen el marco especial DIAN para competencias comportamentales."}, {"t": "Resolución 0065", "q": "El diccionario DIAN presenta una competencia, su definición, niveles y conductas observables. ¿Para qué sirven principalmente las conductas observables?", "o": ["Para identificar cómo se evidencia la competencia en el desempeño", "Para reemplazar las funciones del cargo", "Para eliminar la evaluación", "Para establecer requisitos de formación"], "a": 0, "f": "Las conductas observables permiten relacionar la competencia con comportamientos verificables."}, {"t": "Resolución 0066", "q": "Una aspirante compara su formación y experiencia con la ficha de un empleo DIAN. ¿Qué debe revisar además de los requisitos mínimos?", "o": ["Si cumple las condiciones de las equivalencias autorizadas por la regulación aplicable", "Si tiene una recomendación", "Si puede omitir la experiencia", "Si el cargo no tiene funciones"], "a": 0, "f": "Las equivalencias solo operan cuando están autorizadas y se cumplen sus condiciones."}, {"t": "Resolución 0067", "q": "¿Qué instrumento orienta las funciones y competencias funcionales de los empleos DIAN?", "o": ["El Manual Específico de Requisitos y Funciones (MERF)", "Una encuesta de preferencias", "El Código de Integridad únicamente", "Una circular de otra entidad"], "a": 0, "f": "La Resolución 0067 de 2024 adopta el MERF."}, {"t": "Marco especial DIAN", "q": "Para estudiar un empleo DIAN, el aspirante encuentra una diferencia entre el marco general y la regulación especial. ¿Qué debe hacer?", "o": ["Aplicar la regulación especial DIAN vigente y contrastarla con la convocatoria y la ficha del empleo", "Sustituir siempre la regulación DIAN por el Decreto 815", "Escoger la norma que resulte más sencilla", "Ignorar la ficha del empleo"], "a": 0, "f": "La DIAN tiene un marco especial; debe revisarse la norma vigente, la convocatoria y el empleo específico."}, {"t": "Código de Integridad DIAN", "q": "¿Cuáles son los cinco valores del Código de Integridad DIAN estudiado en este módulo?", "o": ["Honestidad, respeto, compromiso, diligencia y justicia", "Rapidez, obediencia, reserva, amistad y éxito", "Antigüedad, jerarquía, economía, silencio y lealtad", "Competencia, publicidad, delegación, control y sanción"], "a": 0, "f": "El Código de Integridad DIAN trabaja honestidad, respeto, compromiso, diligencia y justicia."}, {"t": "Código de Integridad DIAN", "q": "Un ciudadano ofrece un regalo para que su trámite sea atendido primero. ¿Cuál conducta es coherente con la integridad?", "o": ["Rechazar el beneficio y aplicar el procedimiento sin trato preferencial", "Aceptarlo si nadie se entera", "Recibirlo y acelerar el trámite", "Pedir otro regalo para compartirlo"], "a": 0, "f": "La integridad exige rechazar beneficios que comprometan la imparcialidad y aplicar criterios generales."}, {"t": "Código de Integridad DIAN", "q": "Una servidora detecta un error propio que puede afectar un trámite. ¿Qué actuación refleja honestidad y diligencia?", "o": ["Informarlo, evaluar su impacto y participar en la corrección", "Ocultarlo hasta que alguien lo descubra", "Modificar la evidencia", "Culpar a otra dependencia"], "a": 0, "f": "Reconocer el error y corregirlo con trazabilidad protege el servicio y la confianza."}, {"t": "Código de Integridad DIAN", "q": "Un funcionario recibe datos reservados por razón de su cargo. ¿Qué debe hacer?", "o": ["Usarlos solo para la finalidad autorizada y protegerlos frente a accesos indebidos", "Compartirlos con amistades de confianza", "Publicarlos para demostrar transparencia", "Usarlos para beneficio personal"], "a": 0, "f": "El respeto y la integridad exigen proteger la información y usarla conforme a la autorización."}, {"t": "Código de Integridad DIAN", "q": "Dos ciudadanos en situaciones semejantes solicitan respuestas diferentes. ¿Qué debe hacer el servidor?", "o": ["Comparar criterios, aplicar reglas consistentes y explicar cualquier diferencia objetiva", "Conceder la ventaja a quien insista más", "Decidir según amistad", "Evitar dejar registro"], "a": 0, "f": "La justicia exige criterios consistentes, explicables y libres de preferencias indebidas."}];let i=0,score=0,answered=false;const $=id=>document.getElementById(id);function render(){let x=Q[i];$('topic').textContent=x.t;$('count').textContent=`Pregunta ${i+1} de ${Q.length}`;$('fill').style.width=((i+1)/Q.length*100)+'%';$('question').textContent=x.q;$('options').innerHTML=x.o.map((v,n)=>`<label class="option"><input type="radio" name="answer" value="${n}"> ${v}</label>`).join('');$('feedback').classList.add('hidden');$('feedback').textContent='';$('prev').disabled=i===0;$('next').textContent='Responder';answered=false}function answer(){let chosen=document.querySelector('input[name=answer]:checked');if(!chosen)return alert('Seleccione una respuesta.');let x=Q[i],ok=+chosen.value===x.a;if(ok)score++;document.querySelectorAll('input[name=answer]').forEach(e=>e.disabled=true);$('feedback').textContent=(ok?'Correcto. ':'Revisemos. ')+x.f;$('feedback').classList.remove('hidden');$('next').textContent=i===Q.length-1?'Ver resultado':'Siguiente';answered=true}$('next').onclick=()=>{if(!answered){answer();return}if(i<Q.length-1){i++;render()}else{$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`${score}/${Q.length}`}};$('prev').onclick=()=>{if(i){i--;render()}};render();</script></body></html>
